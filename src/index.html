<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panasa | Fintech Engineering Studio</title>
    <meta name="description" content="Panasa helps fintechs launch and scale with AI-native engineering, ops, and compliance." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Panasa Technology" />
    <meta property="og:title" content="Panasa | Fintech Engineering Studio" />
    <meta property="og:description" content="Panasa helps fintechs launch and scale with AI-native engineering, ops, and compliance." />
    <meta property="og:url" content="https://www.panasatech.com/" />
    <meta property="og:image" content="https://www.panasatech.com/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Panasa | Fintech Engineering Studio" />
    <meta name="twitter:description" content="Panasa helps fintechs launch and scale with AI-native engineering, ops, and compliance." />
    <meta name="twitter:image" content="https://www.panasatech.com/assets/og-image.png" />
    <link rel="canonical" href="https://www.panasatech.com/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Panasa Technology",
      "url": "https://www.panasatech.com",
      "logo": "https://www.panasatech.com/assets/logo.svg",
      "description": "Panasa helps fintechs launch and scale with AI-native engineering, ops, and compliance.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@panasatech.com",
        "contactType": "sales"
      },
      "address": [
        {
          "@type": "PostalAddress",
          "addressCountry": "GB",
          "addressLocality": "Brighton & Hove",
          "streetAddress": "Maritime House, Basin Rd North"
        },
        {
          "@type": "PostalAddress",
          "addressCountry": "IN",
          "addressLocality": "Kochi",
          "streetAddress": "9th Floor, Carnival Infopark Phase 2"
        }
      ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://rsms.me" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=lufga@400,500,600,700&display=swap" crossorigin="anonymous" as="style" />
    <link rel="preload" href="https://rsms.me/inter/inter.css" crossorigin="anonymous" as="style" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=lufga@400,500,600,700&display=swap" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/shared-layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/shared-logo-marquee.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/shared-testimonials.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/shared-footer.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="css/email-capture.css" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div class="page">
      <header class="site-header" id="top">
        <nav class="nav">
          <div class="brand">
            <img src="assets/logo.svg" alt="Panasa" data-bind="logo" fetchpriority="high" />
          </div>
          <button class="nav-toggle" aria-label="Open navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <ul class="nav-links" data-nav-links></ul>
        </nav>
      </header>

      <main>
        <section class="hero" id="about" data-animate>
          <div class="hero-grid">
            <div class="hero-copy" data-animate>
              <span class="pill" data-hero-pill>Trusted by fintechs across UK, EU &amp; APAC</span>
              <h1>
                <span data-hero-title>Ship &amp; Modernise Your Fintech in Weeks</span>
                <em data-hero-title-emphasis>Scale Without Surprises</em>
              </h1>
              <p data-hero-subtitle>Your AI-Native Partner for Dev, Ops &amp; Scale. No Handoffs.</p>
              <div class="hero-actions">
                <a class="btn btn-dark" data-hero-cta-primary></a>
                <a class="btn btn-ghost" data-hero-cta-secondary></a>
              </div>
              <div class="trusted-row">
                <span data-hero-trusted-label></span>
                <div class="trusted-logos" data-hero-trusted-logos></div>
              </div>
            </div>
          </div>
          <div class="cert-row single" data-hero-cert-badges>
            <img src="assets/certifications.svg" alt="Certifications" fetchpriority="high" />
          </div>
          <div class="cert-separator" aria-hidden="true"></div>
        </section>

        <section class="services" id="services" data-animate>
          <div class="services-shell">
            <div class="services-head" data-animate>
              <div class="services-heading">
                <span class="pill" data-services-pill></span>
                <h2 data-services-title></h2>
              </div>
              <p class="services-summary" data-services-subtitle></p>
            </div>
            <div class="services-feature" data-animate>
              <div class="services-carousel" data-services-carousel>
                <div class="services-slides" data-services-slides></div>
              </div>
              <div class="services-dots" data-services-dots></div>
            </div>
          </div>
        </section>

        <section class="dark-section" id="resources" data-animate>
          <div class="section-title section-title-split section-title-split-dark" data-animate>
            <div class="section-heading-copy">
              <span class="pill" data-why-pill></span>
              <h2 data-why-title></h2>
            </div>
            <p data-why-subtitle></p>
          </div>
          <div class="feature-grid" data-why-cards></div>
        </section>

        <section class="results" id="careers" data-animate>
          <div class="section-title section-title-split" data-animate>
            <div class="section-heading-copy">
              <span class="pill" data-case-pill></span>
              <h2 data-case-title></h2>
            </div>
            <p data-case-subtitle></p>
          </div>
          <div class="carousel" data-carousel>
            <div class="slides" data-case-slides></div>
            <div class="slider-dots" role="tablist" aria-label="Case study slides" data-case-dots></div>
          </div>
        </section>

        <section class="testimonials shared-testimonials" data-animate>
          <div class="section-title section-title-split section-title-split-dark" data-animate>
            <div class="section-heading-copy">
              <span class="pill" data-testimonials-pill></span>
              <h2 data-testimonials-title></h2>
            </div>
            <p data-testimonials-subtitle></p>
          </div>
          <div class="split-testimonial-shell" data-animate>
            <button class="split-testimonial-arrow prev" type="button" aria-label="Previous testimonial" data-testimonials-prev>
              <
            </button>
            <div class="split-testimonial-viewport">
              <div class="split-testimonial-track" data-testimonials-track></div>
            </div>
            <button class="split-testimonial-arrow next" type="button" aria-label="Next testimonial" data-testimonials-next>
              >
            </button>
            <div class="split-testimonial-dots" data-testimonials-dots></div>
          </div>
        </section>

        <section class="engagement" id="contact" data-animate>
          <div class="section-title section-title-split" data-animate>
            <div class="section-heading-copy">
              <span class="pill" data-engagement-pill></span>
              <h2 data-engagement-title></h2>
            </div>
            <p data-engagement-subtitle></p>
          </div>
          <div class="engagement-filters" data-engagement-filters></div>
          <div class="engagement-grid" data-engagement-grid></div>
          <p class="engagement-note" data-engagement-note></p>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-cta" data-animate>
          <div>
            <h2 data-footer-cta-title></h2>
            <p data-footer-cta-text></p>
          </div>
          <button class="btn btn-light" data-footer-cta-button></button>
        </div>

        <div class="footer-card" data-animate>
          <div class="footer-brand">
            <img src="assets/logo.svg" alt="Panasa" data-bind="logo" />
            <p data-footer-brand-text></p>
            <span data-footer-email></span>
            <span data-footer-phone></span>
          </div>
          <div class="footer-links" data-footer-columns></div>
          <div class="footer-bottom">
            <span data-footer-copyright></span>
            <div class="footer-meta" data-footer-legal-links></div>
          </div>
        </div>
      </footer>
    </div>

    <script src="content/Home page/default.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
