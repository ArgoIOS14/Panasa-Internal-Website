<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panasa Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <h1>Panasa Admin</h1>
      <p>Sign in to manage site content.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
        <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>
      </form>
    </div>
  </div>

  <!-- Admin Panel (hidden until authenticated) -->
  <div id="admin-panel" class="admin-hidden">

    <header class="admin-header">
      <h1>Panasa CMS</h1>
      <div class="admin-header-actions">
        <span id="rebuild-status" class="rebuild-badge"></span>
        <span id="admin-user" class="admin-user"></span>
        <span id="admin-role-badge" class="admin-role-badge" style="display:none"></span>
        <button id="reviews-btn" class="btn btn-secondary btn-small" style="display:none" data-help="Open the review queue.">Reviews <span id="reviews-badge" class="reviews-badge" style="display:none"></span></button>
        <button id="my-submissions-btn" class="btn btn-secondary btn-small" style="display:none" data-help="View the status of content you\u2019ve submitted for review.">My Submissions</button>
        <button id="preview-toggle" class="btn btn-secondary btn-small" title="Toggle live preview" data-help="Preview your changes in a side panel before publishing.">Preview</button>
        <button id="history-btn" class="btn btn-secondary btn-small" data-help="View and restore previous published versions.">History</button>
        <div class="header-tools-menu">
          <button id="tools-menu-btn" class="btn btn-secondary btn-small" aria-expanded="false" aria-haspopup="true">Tools &#9662;</button>
          <div id="tools-dropdown" class="tools-dropdown">
            <button id="analytics-btn" class="tools-dropdown-item">Dashboard</button>
            <button id="audit-btn" class="tools-dropdown-item">Audit Log</button>
            <button id="bulk-ops-btn" class="tools-dropdown-item">Bulk Operations</button>
            <button id="activity-btn" class="tools-dropdown-item" style="display:none">Activity Dashboard</button>
            <button id="users-btn" class="tools-dropdown-item" style="display:none">Users &amp; Roles</button>
          </div>
        </div>
        <button id="help-btn" class="btn-help" title="Help & Tutorial" data-help="Open the help guide or restart the tutorial.">?</button>
        <button id="logout-btn" class="btn btn-secondary btn-small">Log out</button>
      </div>
    </header>

    <div class="admin-body">
      <!-- Page selector + status -->
      <div class="admin-toolbar">
        <div class="page-selector" data-help="Select which website page to edit. Each page has its own content sections.">
          <label class="page-selector-label">Editing:</label>
          <select id="page-select">
            <option value="aiAcceleratedEngineering">AI Accelerated Engineering</option>
            <option value="legacyModernisation">Legacy Modernisation</option>
            <option value="intelligentOperations">Intelligent Operations</option>
            <option value="aiGovernance">AI Governance</option>
            <option value="servicesOverview">Services Overview</option>
            <option value="home">Home Page</option>
            <option value="about">About Us</option>
            <option value="contact">Contact</option>
            <option value="careers">Careers</option>
            <option value="privacyPolicy">Privacy Policy</option>
          </select>
          <span id="page-status" class="page-status"></span>
        </div>
        <div class="admin-search" style="position:relative">
          <input type="text" id="search-input" placeholder="Search sections..." class="search-input">
          <label for="search-input" class="sr-only">Search sections</label>
          <button id="search-mode-toggle" class="btn btn-sm search-mode-btn" title="Search across all pages">All pages</button>
          <div id="search-results" class="search-results-dropdown" style="display:none"></div>
        </div>
      </div>

      <!-- Conflict banner -->
      <div id="conflict-banner" class="conflict-banner" style="display:none"></div>

      <!-- Editor sections -->
      <div id="editor-sections"></div>

      <!-- Validation summary -->
      <div id="validation-summary" class="validation-summary" style="display:none"></div>

      <!-- Action bar -->
      <div class="save-bar">
        <div class="save-bar-left">
          <button id="undo-btn" class="btn btn-undo" title="Undo" disabled data-help="Undo the last change.">&#8617;</button>
          <button id="redo-btn" class="btn btn-redo" title="Redo" disabled data-help="Redo a previously undone change.">&#8618;</button>
        </div>
        <div class="save-bar-center">
          <button id="save-btn" class="btn btn-primary" data-help="Save changes as a private draft. Won't affect the live site.">Save Draft <kbd></kbd></button>
          <button id="publish-btn" class="btn btn-publish" data-help="Make changes live on the website. Triggers an HTML rebuild for SEO.">Publish <kbd></kbd></button>
          <button id="submit-review-btn" class="btn btn-publish" style="display:none" data-help="Send these changes to an approver for review.">Submit for Review</button>
          <span id="save-status" class="save-status"></span>
          <span id="autosave-status" class="autosave-status"></span>
        </div>
        <div class="save-bar-right">
          <input id="version-note" type="text" class="version-note-input" placeholder="Version note" maxlength="100" data-help="Optional note describing this publish (shown in version history)." />
          <button id="save-bar-more" class="btn btn-secondary btn-small" aria-expanded="false">More &#9662;</button>
          <div id="save-bar-overflow" class="save-bar-overflow">
            <button id="preview-btn" class="overflow-item">Preview in new tab</button>
            <button id="rebuild-btn" class="overflow-item">Rebuild HTML</button>
            <button id="revert-btn" class="overflow-item overflow-danger">Revert to Default</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Panel (sidebar) -->
  <div id="preview-panel" class="preview-panel" style="display:none">
    <div class="preview-toolbar">
      <div class="preview-devices">
        <button class="preview-device active" data-device="desktop">Desktop</button>
        <button class="preview-device" data-device="tablet">Tablet</button>
        <button class="preview-device" data-device="mobile">Mobile</button>
      </div>
      <button id="preview-close" class="btn btn-sm">&#10005; Close</button>
    </div>
    <div class="preview-iframe-wrap">
      <iframe id="preview-iframe" class="preview-iframe"></iframe>
    </div>
  </div>

  <!-- Image Gallery Modal -->
  <div id="gallery-modal" class="modal-overlay" role="dialog" aria-modal="true" style="display:none">
    <div class="modal-content gallery-modal">
      <div class="modal-header gallery-header">
        <h2>Image Gallery</h2>
        <input id="gallery-search" type="text" class="gallery-search-input" placeholder="Search images..." />
        <button id="batch-upload-btn" class="btn btn-sm">Batch Upload</button>
        <input id="batch-file-input" type="file" multiple accept="image/*" style="display:none" />
        <button id="gallery-close" class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="gallery-tabs">
        <button class="gallery-tab active" data-tab="uploads">Uploads</button>
        <button class="gallery-tab" data-tab="assets">Site Assets</button>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <div id="gallery-loading" class="gallery-loading">Loading images...</div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="modal-overlay" role="dialog" aria-modal="true" style="display:none">
    <div class="modal-content history-modal">
      <div class="modal-header">
        <h2>Version History</h2>
        <button id="history-close" class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="history-loading" class="gallery-loading">Loading history...</div>
    </div>
  </div>

  <!-- Restore draft prompt -->
  <div id="restore-prompt" class="restore-prompt" style="display:none">
    <span>You have unsaved changes from a previous session.</span>
    <button id="restore-yes" class="btn btn-primary btn-small">Restore</button>
    <button id="restore-no" class="btn btn-secondary btn-small">Discard</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script type="module" src="js/admin/main.js"></script>
</body>
</html>
