<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panasa Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <h1>Panasa Admin</h1>
      <p>Sign in to manage site content.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- Admin Panel (hidden until authenticated) -->
  <div id="admin-panel" class="admin-hidden">

    <header class="admin-header">
      <h1>Panasa CMS</h1>
      <div class="admin-header-actions">
        <span id="admin-user" class="admin-user"></span>
        <button id="history-btn" class="btn btn-secondary btn-small">History</button>
        <button id="logout-btn" class="btn btn-secondary btn-small">Log out</button>
      </div>
    </header>

    <div class="admin-body">
      <!-- Page selector + status -->
      <div class="admin-toolbar">
        <div class="page-selector">
          <label class="page-selector-label">Editing:</label>
          <select id="page-select">
            <option value="aiAcceleratedEngineering">AI Accelerated Engineering</option>
            <option value="legacyModernisation">Legacy Modernisation</option>
            <option value="intelligentOperations">Intelligent Operations</option>
            <option value="aiGovernance">AI Governance</option>
            <option value="servicesOverview">Services Overview</option>
            <option value="home">Home Page</option>
            <option value="about">About Us</option>
            <option value="contact">Contact</option>
            <option value="careers">Careers</option>
            <option value="privacyPolicy">Privacy Policy</option>
          </select>
          <span id="page-status" class="page-status"></span>
        </div>
        <div class="admin-search">
          <input type="text" id="search-input" placeholder="Search sections..." class="search-input">
        </div>
      </div>

      <!-- Editor sections -->
      <div id="editor-sections"></div>

      <!-- Validation summary -->
      <div id="validation-summary" class="validation-summary" style="display:none"></div>

      <!-- Action bar -->
      <div class="save-bar">
        <button id="save-btn" class="btn btn-primary">Save Draft</button>
        <button id="publish-btn" class="btn btn-publish">Publish</button>
        <button id="preview-btn" class="btn btn-secondary btn-small">Preview</button>
        <button id="revert-btn" class="btn btn-revert btn-small">Revert to Default</button>
        <span id="save-status" class="save-status"></span>
        <span id="autosave-status" class="autosave-status"></span>
      </div>
    </div>
  </div>

  <!-- Image Gallery Modal -->
  <div id="gallery-modal" class="modal-overlay" style="display:none">
    <div class="modal-content gallery-modal">
      <div class="modal-header">
        <h2>Image Gallery</h2>
        <button id="gallery-close" class="modal-close">&times;</button>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <div id="gallery-loading" class="gallery-loading">Loading images...</div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="modal-overlay" style="display:none">
    <div class="modal-content history-modal">
      <div class="modal-header">
        <h2>Version History</h2>
        <button id="history-close" class="modal-close">&times;</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="history-loading" class="gallery-loading">Loading history...</div>
    </div>
  </div>

  <!-- Restore draft prompt -->
  <div id="restore-prompt" class="restore-prompt" style="display:none">
    <span>You have unsaved changes from a previous session.</span>
    <button id="restore-yes" class="btn btn-primary btn-small">Restore</button>
    <button id="restore-no" class="btn btn-secondary btn-small">Discard</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script type="module" src="js/admin/main.js"></script>
</body>
</html>
